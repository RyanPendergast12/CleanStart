# XcodeGen spec. On a Mac: `brew install xcodegen && xcodegen generate`,
# then open CleanStart.xcodeproj.
#
# Before building for your iPhone, change the three CLEANSTART_* / team
# values below to your own (see README › "Install on your iPhone").
name: CleanStart

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: ""                              # your 10-character Team ID
    CLEANSTART_BUNDLE_ID: com.example.cleanstart       # must be unique to you
    CLEANSTART_APP_GROUP: group.com.example.cleanstart # "group." + bundle id
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  CleanStartCore:
    path: CleanStartCore

targets:
  CleanStart:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: CleanStartCore
      - target: CleanStartActivityMonitor
      - target: CleanStartShield
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLEANSTART_BUNDLE_ID)
        PRODUCT_NAME: CleanStart
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CleanStart
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.cleanstart.verify]
        CleanStartAppGroup: $(CLEANSTART_APP_GROUP)
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/CleanStart.entitlements
      properties:
        # NEDNSSettingsManager (system-wide encrypted DNS). Not a VPN entitlement.
        com.apple.developer.networking.networkextension: [dns-settings]
        # Screen Time: AuthorizationCenter, ManagedSettings, DeviceActivity.
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(CLEANSTART_APP_GROUP)]

  CleanStartActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/ActivityMonitor
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLEANSTART_BUNDLE_ID).monitor
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Extensions/ActivityMonitor/Info.plist
      properties:
        CFBundleDisplayName: CleanStart Schedule
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CleanStartAppGroup: $(CLEANSTART_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CleanStartActivityMonitor
    entitlements:
      path: Extensions/ActivityMonitor/CleanStartActivityMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(CLEANSTART_APP_GROUP)]

  CleanStartShield:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/ShieldConfiguration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLEANSTART_BUNDLE_ID).shield
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Extensions/ShieldConfiguration/Info.plist
      properties:
        CFBundleDisplayName: CleanStart Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: Extensions/ShieldConfiguration/CleanStartShield.entitlements
      properties:
        com.apple.developer.family-controls: true

schemes:
  CleanStart:
    build:
      targets:
        CleanStart: all
    run:
      config: Debug
